<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sombras da Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--gold:#d9a441;--gold2:#8a5a2a;--text:#eadfc8;--atk:#e0434b;--cur:#38c487;--trp:#b78cff;--rev:#5cc8ff;--cha:#ffa63d;--hd:'Cinzel',Georgia,serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:16px;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
 background:radial-gradient(ellipse 70% 45% at 50% -8%,#5a2a18 0%,transparent 65%),radial-gradient(ellipse 50% 40% at 0% 100%,#2b0f22 0,transparent 70%),radial-gradient(ellipse 50% 40% at 100% 100%,#0f1f2b 0,transparent 70%),#08050a}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent 0 2px,#0000000f 2px 3px)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 180px #000d}
#vig.hurt{animation:hurt .7s}
@keyframes hurt{0%{box-shadow:inset 0 0 220px 40px #e0000099}100%{box-shadow:inset 0 0 180px #000d}}
header{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;background:linear-gradient(#1c0f10,#0d0708);border-bottom:1px solid var(--gold2);box-shadow:0 4px 24px #000a,0 1px 0 #d9a44044}
h1{margin:0;font:900 1.55rem var(--hd);letter-spacing:3px;text-transform:uppercase;background:linear-gradient(#ffe7a3,#d9a441 55%,#8a5a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px #000)}
h1 span{-webkit-text-fill-color:#e0434b;filter:drop-shadow(0 0 8px #e0434b)}
#goal{flex:1;margin:0;font-size:.95rem;font-style:italic;opacity:.8;min-width:220px}
.hbtns{display:flex;gap:8px}
button,select{font:600 .9rem var(--hd);letter-spacing:.5px;color:#f6e3b0;background:linear-gradient(#3d2116,#22110c);border:1px solid var(--gold2);border-radius:8px;padding:7px 14px;cursor:pointer;transition:.2s;box-shadow:0 2px 0 #000a}
button:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 14px #d9a44066;transform:translateY(-1px)}
button.primary{background:linear-gradient(#c0392b,#7a1a14);border-color:#e8a24a;font-size:1rem;padding:10px}
button.ghost{background:transparent}
main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 280px;gap:14px;padding:14px 18px;min-height:0}
#table{position:relative;min-height:min(52vh,460px);border-radius:50%/44%;border:14px solid transparent;
 background:radial-gradient(ellipse at 50% 50%,#d9a44026 0,transparent 45%) padding-box,radial-gradient(ellipse,#1f5a34 0,#14391f 60%,#0a2013 100%) padding-box,repeating-linear-gradient(92deg,#6a4220 0 7px,#4e2e14 7px 14px) border-box;
 box-shadow:inset 0 0 70px #000,0 14px 40px #000c,0 0 0 2px #1a0d06,0 0 60px #d9a44018;transition:.25s}
#table:after{content:"";position:absolute;inset:3.5%;border-radius:50%/44%;border:1px dashed #d9a44044;pointer-events:none}
#table.drop{box-shadow:inset 0 0 70px #000,0 0 40px #ffd24a77}
#table.over{box-shadow:inset 0 0 110px #ffd24a55,0 0 70px #ffd24a;border-color:#ffd24a}
#seats{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center;width:164px;padding:7px 10px;border-radius:14px;border:1px solid var(--gold2);background:linear-gradient(160deg,#2e1b14ee,#140b0cee);box-shadow:0 6px 16px #000b,inset 0 1px 0 #ffffff12;transition:.3s;z-index:3;font-size:.85rem}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:radial-gradient(circle at 35% 30%,#6a4a2a,#1a0f0a);border:2px solid var(--gold);box-shadow:0 0 10px #000}
.si{flex:1;min-width:0}.si b{display:block;font:700 .82rem var(--hd);color:#fbe7b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:13px;margin:3px 0;border-radius:7px;background:#000a;border:1px solid #000;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#5be39a,#1c8a55);transition:width .5s}
.bar.low i{background:linear-gradient(#ff6a5c,#a0161a)}
.bar span{position:absolute;inset:0;text-align:center;font:700 .62rem/13px var(--hd);text-shadow:0 1px 2px #000}
.mt{font-size:.78rem;opacity:.9}.mt em{font-style:normal;color:#8fd3ff;margin-left:6px}
.trap{display:block;margin-top:2px;font-size:.7rem;color:#d5b8ff;text-shadow:0 0 6px #b78cff}
.seat.active{border-color:#ffd24a;animation:ring 1.6s infinite;transform:translate(-50%,-50%) scale(1.08)}
@keyframes ring{50%{box-shadow:0 0 26px #ffd24acc,0 6px 16px #000b}0%,100%{box-shadow:0 0 10px #ffd24a66,0 6px 16px #000b}}
.seat.dead{filter:grayscale(1) brightness(.5);border-style:dashed}
.seat.hit{animation:shake .5s,flashr .5s}.seat.healed{animation:flashg .7s}.seat.revived{animation:rise 1.2s}
@keyframes shake{20%,60%{margin-left:-9px}40%,80%{margin-left:9px}}
@keyframes flashr{50%{background:#a01010;box-shadow:0 0 30px #f33}}@keyframes flashg{50%{background:#14683a;box-shadow:0 0 26px #4f9}}
@keyframes rise{0%{filter:brightness(5) blur(4px);transform:translate(-50%,-10%) scale(.6)}60%{filter:brightness(2) drop-shadow(0 0 20px #8fdcff)}100%{filter:none}}
.fnum{position:fixed;z-index:60;transform:translateX(-50%);font:900 2rem var(--hd);pointer-events:none;text-shadow:0 0 10px #000,0 2px 0 #000;animation:fup 1.2s ease-out forwards}
.fnum.dmg{color:#ff5a55}.fnum.heal{color:#5dffa5}.fnum.sh{color:#8fd3ff}
@keyframes fup{0%{opacity:0;margin-top:10px;scale:.5}15%{opacity:1;scale:1.3}100%{opacity:0;margin-top:-70px;scale:1}}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:46%;pointer-events:none;z-index:1}
.pile{width:58px;height:82px;border-radius:8px;border:2px solid var(--gold2);background:repeating-linear-gradient(45deg,#4a1818 0 6px,#2d0c0c 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 .6rem var(--hd);text-align:center;box-shadow:0 6px 14px #000a,inset 0 0 12px #000}
.pile big{font-size:1.3rem}
#played{min-width:60px;min-height:84px}
#fx{width:100%;text-align:center;font:600 .95rem var(--hd);color:#ffe3a0;text-shadow:0 0 10px #000,0 0 18px #d9a44088;min-height:2.4em}
/* cartas */
.card{--c:var(--gold);position:relative;display:flex;flex-direction:column;align-items:center;width:140px;min-width:140px;height:216px;padding:7px 8px;border-radius:13px;border:2px solid var(--c);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
 background:linear-gradient(175deg,#3f2d1e 0,#21150e 55%,#140c08);box-shadow:0 8px 18px #000b,inset 0 0 0 1px #000,inset 0 0 26px #ffffff0a;transform:rotate(var(--r,0deg)) translateY(var(--y,0));transition:transform .18s,box-shadow .18s}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),transparent 40%);pointer-events:none}
.c-ATAQUE{--c:var(--atk)}.c-CURA{--c:var(--cur)}.c-ARMADILHA{--c:var(--trp)}.c-RESSURREIÇÃO{--c:var(--rev)}.c-CAOS{--c:var(--cha)}
.cn{display:flex;justify-content:space-between;width:100%;font:700 .5rem var(--hd);letter-spacing:1.5px;color:var(--c)}.rr{color:#ffe27a}
.art{margin:5px 0 4px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,#000),#0a0605 75%);box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
.sym{font-size:1.9rem;filter:drop-shadow(0 2px 3px #000)}
.nm{font:700 .72rem var(--hd);text-align:center;color:#fbe7b6;line-height:1.1}
.ds{margin:4px 0 0;font-size:.66rem;line-height:1.15;text-align:center;opacity:.92}
.cs{margin:auto 0 0;padding-top:4px;width:100%;border-top:1px dashed #ffffff33;font-size:.62rem;line-height:1.1;text-align:center;color:#ffb48a}
.rare{box-shadow:0 8px 18px #000b,0 0 18px #ffd24a77}
.rare:after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#ffffff44 50%,transparent 60%);animation:foil 3.2s infinite;pointer-events:none}
@keyframes foil{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.card:hover{transform:translateY(-22px) scale(1.12) rotate(0);z-index:4;box-shadow:0 18px 30px #000c,0 0 22px color-mix(in srgb,var(--c) 70%,transparent)}
.card.off{opacity:.45;filter:saturate(.4)}.card.dragging{opacity:.2}
.card.ghost{position:fixed;z-index:70;pointer-events:none;transform:scale(1.15) rotate(-4deg);box-shadow:0 22px 40px #000}
.card.mini{width:60px;min-width:60px;height:84px;padding:3px;cursor:default;transform:none!important;box-shadow:0 4px 10px #000a}
.card.mini .cn,.card.mini .ds,.card.mini .cs{display:none}.card.mini .art{width:34px;height:34px;margin:2px 0}.card.mini .sym{font-size:1.1rem}.card.mini .nm{font-size:.44rem}
/* revelação */
.rv{position:fixed;z-index:80;perspective:1100px;pointer-events:none;filter:drop-shadow(0 0 30px var(--c))}
.rvin{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:13px}
.back{transform:rotateY(180deg);border:3px solid var(--gold);background:radial-gradient(circle,#d9a44055 0,transparent 35%),repeating-linear-gradient(45deg,#5a1a1a 0 8px,#2d0c0c 8px 16px);box-shadow:inset 0 0 30px #000}
.back:after{content:"☠";position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;color:var(--gold);text-shadow:0 0 16px #000}
.rv .card{width:100%;height:100%;min-width:0;transform:none!important;cursor:default;padding:12px}
.rv .cn{font-size:.7rem}.rv .art{width:30%;aspect-ratio:1;height:auto;margin:10px 0 8px}.rv .sym{font-size:3.2rem}.rv .nm{font-size:1.1rem}.rv .ds{font-size:.92rem}.rv .cs{font-size:.82rem}
/* rodapé e log */
#logPanel{display:flex;flex-direction:column;min-height:200px;max-height:68vh;padding:10px 12px;border-radius:12px;border:1px solid var(--gold2);background:linear-gradient(#1b1010e6,#0e0809e6);box-shadow:0 8px 24px #000a}
#logPanel h3{margin:0 0 8px;text-align:center;font:700 .85rem var(--hd);letter-spacing:2px;color:var(--gold);padding-bottom:6px;border-bottom:1px solid #d9a44033}
#log{margin:0;padding:0;list-style:none;overflow-y:auto;flex:1;font-size:.88rem}
#log li{padding:2px 0 2px 8px;border-left:2px solid transparent;opacity:.92}
.l-damage{color:#ff8f86;border-color:#e0434b!important}.l-heal{color:#7dffb8;border-color:#38c487!important}.l-shield{color:#9fd8ff}.l-elim{color:#ff5a55;font-weight:700}.l-revive{color:#8fdcff;font-weight:700}.l-trap{color:#d5b8ff}.l-turn{color:var(--gold);font-family:var(--hd);font-size:.8rem;margin-top:6px}.l-end{color:#ffd24a;font-weight:700}.l-reshuffle,.l-play{color:#bdb39c}
footer{position:relative;z-index:2;padding:6px 14px 14px;background:linear-gradient(transparent,#0d0708 40%)}
#handInfo{text-align:center;font:600 .8rem var(--hd);color:var(--gold);letter-spacing:1px}
#hand{display:flex;gap:12px;justify-content:center;padding:26px 4px 6px;min-height:230px;overflow:visible}
#actions{text-align:center;min-height:1.4em}#hint{font-style:italic;color:#ffd98a}
.overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0009,#000e);backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.box{display:flex;flex-direction:column;gap:14px;width:min(92vw,380px);padding:26px;text-align:center;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(#2a1710,#120a0a);box-shadow:0 0 60px #d9a44044,inset 0 0 40px #000}
.box h2{margin:0;font:900 1.7rem var(--hd);letter-spacing:2px;color:var(--gold);text-shadow:0 0 18px #d9a44088}.box p{margin:0;font-style:italic;opacity:.85}
.box label{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:820px){
 main{grid-template-columns:1fr;padding:8px}h1{font-size:1.15rem}#goal{display:none}
 #table{min-height:430px;border-width:9px;border-radius:34px}#table:after{display:none}
 .seat{width:112px;padding:4px 6px;gap:4px;font-size:.7rem}.av{width:28px;height:28px;font-size:1rem;border-width:1px}.si b{font-size:.64rem}.bar{height:11px}.bar span{line-height:11px}
 #center{width:58%;gap:6px}.pile{width:42px;height:60px}#played{min-width:46px}.card.mini{width:44px;min-width:44px;height:62px}
 #logPanel{max-height:140px;min-height:110px}
 .card{width:108px;min-width:108px;height:186px;padding:5px}.sym{font-size:1.5rem}.art{width:46px;height:46px}.ds{font-size:.56rem}.cs{font-size:.52rem}.nm{font-size:.62rem}
 #hand{gap:6px;min-height:200px}
}
</style></head>
<body>
<div id="err" style="display:none;position:fixed;z-index:99;left:0;right:0;top:0;background:#900;color:#fff;padding:8px;font:13px monospace"></div>
<script>window.onerror=function(m,u,l){var e=document.getElementById("err");e.style.display="block";e.textContent="Erro: "+m+" ("+String(u).split("/").pop()+":"+l+") — tente Ctrl+F5 e confirme que a pasta js/ está completa."}</script>
<div id="vig"></div>
<header>
  <h1><span>☠</span> Sombras da Mesa</h1>
  <p id="goal">Seja o último vivo. Arraste uma carta até a mesa — todo poder cobra um contraponto.</p>
  <div class="hbtns"><button id="btnSet">⚙ Config.</button><button id="btnRestart">↻ Reiniciar</button></div>
</header>
<main>
  <section id="table">
    <div id="seats"></div>
    <div id="center">
      <div class="pile" id="deckPile"></div>
      <div id="played"></div>
      <div class="pile" id="discPile"></div>
      <div id="fx">A mesa aguarda...</div>
    </div>
  </section>
  <aside id="logPanel"><h3>❖ Crônica da Mesa ❖</h3><ol id="log"></ol></aside>
</main>
<footer>
  <div id="handInfo"></div>
  <div id="hand"></div>
  <div id="actions"><span id="hint"></span></div>
</footer>
<div id="menu" class="overlay"><div class="box">
  <h2 id="menuTitle">Sombras da Mesa</h2>
  <p id="menuMsg">Sobreviva. Elimine. Ressuscite (ou não).</p>
  <label>Jogadores (você + bots)
    <select id="selN"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
  <label>Dificuldade
    <select id="selD"><option value="easy">Fácil</option><option value="normal" selected>Normal</option></select></label>
  <label>Velocidade
    <select id="selS"><option value="1.4">Lenta</option><option value="1" selected>Normal</option><option value="0.5">Rápida</option></select></label>
  <button id="btnStart" class="primary">Iniciar partida</button>
  <button id="btnClose" class="ghost">Fechar</button>
</div></div>
<script>(function (G) {
  G.CONFIG = { maxHp: 6, handSize: 2, trapLimit: 1, turnCap: 400,
    names: ['Morgana', 'Valdric', 'Sylas', 'Isolde', 'Korvath'] };
  G.createState = function (n, difficulty) {
    const C = G.CONFIG, players = [];
    for (let i = 0; i < n; i++)
      players.push({ id: i, name: i === 0 ? 'Você' : C.names[i - 1], isBot: i > 0,
        hp: C.maxHp, shield: 0, alive: true, hand: [], traps: [] });
    const s = { players, deck: [], discard: [], current: 0, turn: 0, phase: 'start',
      over: false, winner: null, difficulty: difficulty || 'normal',
      lastPlayed: null, revivedNow: new Set() };
    G.Deck.build(s);
    players.forEach(p => G.Deck.draw(s, p.id, C.handSize, []));
    return s;
  };
  G.alivePlayers = s => s.players.filter(p => p.alive);
})(window.Game = window.Game || {});
</script><script>(function (G) {
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  G.Deck = {
    build(s) {
      let uid = 0; s.deck = []; s.discard = [];
      G.CARDS.forEach(c => { for (let i = 0; i < c.count; i++) s.deck.push({ uid: ++uid, id: c.id }); });
      shuffle(s.deck);
    },
    // Compra até n cartas; recicla o descarte se necessário. Retorna quantas foram compradas.
    draw(s, pid, n, ev) {
      let got = 0;
      for (let i = 0; i < n; i++) {
        if (!s.deck.length) {
          if (!s.discard.length) break;
          s.deck = shuffle(s.discard); s.discard = [];
          ev.push({ type: 'reshuffle', text: 'O descarte foi embaralhado e virou o novo baralho.' });
        }
        s.players[pid].hand.push(s.deck.pop()); got++;
      }
      return got;
    },
    discard(s, card) { s.discard.push(card); }
  };
})(window.Game);
</script>
<script>(function (G) {
  // Cada carta: fx = lista de efeitos "op:alvo:n". Os primeiros `m` são o efeito principal; o resto é o CONTRAPONTO.
  // alvo: self | enemy | enemy2 | enemies | alive (qualquer vivo, até você) | all (todos vivos) | dead
  // op: dmg | heal | shield | draw | discard | trap | revive
  const WHO = { self: ['Você', 0], enemy: ['Um inimigo aleatório', 0], enemy2: ['Dois inimigos aleatórios', 1], enemies: ['Todos os inimigos', 1], alive: ['Um vivo aleatório', 0], all: ['Todos os vivos', 1], dead: ['Um eliminado', 0] };
  const pl = (n, w) => n > 1 ? w + 's' : w;
  const VERB = { dmg: ['sofre', 'sofrem', n => `${n} de dano`], heal: ['recupera', 'recuperam', n => `${n} de vida`], shield: ['ganha', 'ganham', n => `${n} de escudo`],
    draw: ['compra', 'compram', n => `${n} ${pl(n, 'carta')}`], discard: ['descarta', 'descartam', n => `${n} ${pl(n, 'carta')} aleatória${n > 1 ? 's' : ''}`] };
  function txt(f) {
    if (f.op === 'trap') return `Arma: quem lhe causar dano recebe ${f.n}.`;
    if (f.op === 'revive') return `Ressuscita um eliminado com ${f.n} de vida.`;
    const w = WHO[f.who], v = VERB[f.op];
    return `${w[0]} ${v[w[1]]} ${v[2](f.n)}.`;
  }
  const C = (id, cat, sym, name, count, fxs, m = 1) => {
    const fx = fxs.map(x => { const [op, who, n] = x.split(':'); return { op, who, n: +n }; });
    return { id, cat, sym, name, count, fx, m, desc: fx.slice(0, m).map(txt).join(' '), cons: fx.slice(m).map(txt).join(' ') };
  };
  const A = 'ATAQUE', H = 'CURA', T = 'ARMADILHA', R = 'RESSURREIÇÃO', X = 'CAOS';
  G.CARDS = [
    C('stab', A, '🗡️', 'Golpe Sombrio', 3, ['dmg:enemy:1', 'heal:alive:1']),
    C('axe', A, '🪓', 'Machado Brutal', 3, ['dmg:enemy:2', 'dmg:self:1']),
    C('storm', A, '🌩️', 'Tempestade', 2, ['dmg:enemies:1', 'heal:enemy:2']),
    C('arrow', A, '🏹', 'Flecha Envenenada', 3, ['dmg:enemy:2', 'draw:alive:1']),
    C('dual', A, '⚔️', 'Golpe Duplo', 2, ['dmg:enemy2:1', 'discard:self:1']),
    C('blood', A, '🩸', 'Sede de Sangue', 2, ['dmg:enemy:3', 'dmg:self:2']),
    C('bolt', A, '⚡', 'Raio Caótico', 2, ['dmg:alive:2', 'heal:alive:2']),
    C('lance', A, '🔱', 'Lança Sombria', 2, ['dmg:enemy:2', 'shield:enemy:2']),
    C('meteor', A, '☄️', 'Meteoro', 1, ['dmg:enemies:2', 'dmg:self:2']),
    C('frost', A, '❄️', 'Dardo Gélido', 2, ['dmg:enemy:1', 'discard:enemy:1', 'draw:enemy:1'], 2),
    C('frenzy', A, '💢', 'Frenesi', 2, ['dmg:enemy:1', 'dmg:enemy:1', 'discard:self:1'], 2),
    C('duel', A, '🤺', 'Duelo Mortal', 1, ['dmg:enemy:3', 'dmg:alive:2']),
    C('ember', A, '🔥', 'Chama Voraz', 2, ['dmg:enemies:1', 'dmg:self:1']),
